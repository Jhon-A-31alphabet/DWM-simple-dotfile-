backend = "xrender";
shadow = false;

# Sin transparencia global: solo la terminal kitty es transparente.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
opacity-rule = [
	"85:class_g = 'kitty'"
];

# Ventanas y barra de estado completamente cuadradas.
corner-radius = 0;

detect-transient = true;
detect-client-leader = true;
use-damage = true;
